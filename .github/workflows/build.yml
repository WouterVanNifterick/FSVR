name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # The engine and its self checks build anywhere. No EPROM image is needed: the checks that want one
  # skip themselves.
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build/cmake -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cmake --config Release
      - name: Test
        run: ctest --test-dir build/cmake -C Release --output-on-failure
      - name: Upload console
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: FSVR-console-windows
          path: bin/fsvr_console.exe
          if-no-files-found: error

  # The plug-in: Hollow (hollow/) with the FSVR skin (plugin/skin), every format the platform has, collected
  # in bin/<format> by the build. The first configure downloads the CLAP and VST3 SDKs, clap-wrapper,
  # RtAudio, RtMidi and the audio decoders; the plug-in's own check (check_plugin) runs on each 64-bit leg.
  plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            configure: -A x64
          - os: windows-latest
            name: windows-x86
            configure: -A Win32
          - os: ubuntu-latest
            name: linux
            configure: -DCMAKE_BUILD_TYPE=Release
          - os: macos-latest
            name: macos
            configure: -DCMAKE_BUILD_TYPE=Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The editor is an X11 window; the standalone's audio and MIDI are RtAudio's ALSA, JACK and
      # PulseAudio backends and RtMidi's ALSA one, each built only when its headers are there.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libasound2-dev libjack-jackd2-dev libpulse-dev pkg-config
      - name: Configure
        run: cmake -B build/plugin -S . -DFSVR_BUILD_PLUGIN=ON ${{ matrix.configure }}
      - name: Build
        run: cmake --build build/plugin --config Release
      - name: Test
        if: matrix.name != 'windows-x86'
        run: ctest --test-dir build/plugin -C Release -R plugin --output-on-failure
      # Zipped here rather than in the release job, because an Actions artifact does not carry the
      # executable bit: bin/ uploaded as loose files comes back 644, and a macOS bundle whose
      # Contents/MacOS file is not executable fails to launch with "The application FSVR can't be
      # opened". A zip records the mode, and the artifact is then that one file, so a download off a
      # plain Actions run is as usable as a release asset. -y keeps the bundles' symlinks as symlinks.
      # Only the plug-in folders go in: the console and render_capture are the engine job's.
      - name: Zip
        if: runner.os != 'Windows'
        run: cd bin && zip -ry ../FSVR-plugin-${{ matrix.name }}.zip $(ls -d CLAP VST3 VST2 AU Standalone 2>/dev/null)
      - name: Zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = 'CLAP', 'VST3', 'VST2', 'VST2 32-bit and DXi', 'Standalone' | Where-Object { Test-Path "bin/$_" } | ForEach-Object { "bin/$_" }
          Compress-Archive -Path $dirs -DestinationPath FSVR-plugin-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FSVR-plugin-${{ matrix.name }}
          path: FSVR-plugin-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    needs: [engine, plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release body is the annotated tag's message (AGENTS.md, "Releases"). generate_release_notes
      # alone left v0.4.6 with nothing but a compare link, and actions/checkout peels a tag ref to its
      # commit, which handed v0.4.7 the commit message, so the tag object is read off the API instead.
      # A lightweight tag has no tag object and fails here on purpose.
      - name: Release notes from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq .object.sha)
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/$sha" --jq .message > notes.md && test -s notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # The plugin jobs upload a ready zip each, so only the console artifact is still loose files.
      - name: Zip the console
        run: |
          cd artifacts
          for d in */; do
            n=${d%/}
            if [ -f "$n/$n.zip" ]; then mv "$n/$n.zip" . && rmdir "$n"; else (cd "$n" && zip -r "../$n.zip" .); fi
          done
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          body_path: notes.md
